services:
  - type: web
    name: achatui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_TIMEOUT
        value: "120000"
      - key: VITE_API_RETRY_ATTEMPTS
        value: "3"
